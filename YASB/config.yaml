      min_bar_height: 0
      gradient: 0
      foreground: "#c0caf5"
      gradient_color_1: '#7aa2f7'
      gradient_color_2: '#7dcfff'
      gradient_color_3: '#c0caf5'
      bars_number: 8
      bar_spacing: 2
      bar_width: 4
      bar_type: "bars"
      framerate: 120
      hide_empty: true

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "\uF001  {title}"
      label_alt: "\uF001  {artist} {s} {title}"
      separator: "-"
      hide_empty: true
      controls_hide: false
      show_thumbnail: false
      thumbnail_alpha: 100
      thumbnail_padding: 0
      max_field_size:
        label: 20
        label_alt: 20
      scrolling_label:
        enabled: true
        update_interval_ms: 60
        style: "left"
        separator: " - "
        always_scroll: false
      media_menu:
        blur: false
        round_corners: true
        alignment: "center"
        direction: "up"
        thumbnail_corner_radius: 0
        thumbnail_size: 120
        max_title_size: 80
        max_artist_size: 80
        show_source: true
      media_menu_icons:
        play: "\uf04b"
        pause: "\uF04C"
        prev_track: "\uF048"
        next_track: "\uF051"
      progress_bar:
        enabled: true
        alignment: "bottom"
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
  hardware-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "hardware-grouper"
      widgets: [
        "wifi",
        "cpu",
        "memory",
        "gpu"
      ]
      collapse_options:
        enabled: true
        expanded_label: "\uf053"
        collapsed_label: "\uf054"
        label_position: "left"
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\uf4bc</span> {info[percent][total]}%"
      label_alt: "<span>\uf4bc</span> {info[percent][total]}%"
      update_interval: 8000
      hide_decimal: true
