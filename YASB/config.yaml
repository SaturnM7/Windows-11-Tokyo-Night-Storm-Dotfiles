      buttons:
        signout: ["\udb80\udf43", "Abmelden"]
        shutdown: ["\uf011", "Herunterfahren"]
        restart: ["\uead2", "Neu starten"]
        hibernate: ["\uf28e", "Ruhezustand"]
        cancel: ["\U000f073a", "Abbrechen"]
