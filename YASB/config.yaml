      vertical_label: "\uDB81\uDCE2"
  glazewm_binding_mode:
    type: "glazewm.binding_mode.GlazewmBindingModeWidget"
    options:
      label: "<span>{icon}</span>"
      hide_if_no_active: false
      default_icon: "\uF005"
      icons:
        none: "\uF005"
        resize: "\uF065"
        pause: "\uF468"
      binding_modes_to_cycle_through: ["none", "resize", "pause"]
      callbacks:
        on_left: "next_binding_mode"
        on_middle: "do_nothing"
        on_right: "disable_binding_mode"
  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: "<span>\uF002</span>"
      search_placeholder: "Suche"
      max_results: 25
      show_icons: true
      icon_size: 24
      providers:
        apps:
          enabled: true
          prefix: "*"
          show_recent: true
          max_recent: 5
          show_description: false
        bookmarks:
          enabled: true
          prefix: "*"
          browser: "firefox"
          profile: "default"
        calculator:
          enabled: true
          prefix: "="
        clipboard_history:
          enabled: true
          prefix: "#"
        web_search:
          enabled: true
          prefix: "?"
          engine: "google"
          remove_engines:
            - "brave"
            - "duckduckgo"
            - "wikipedia"
            - "reddit"
            - "stackoverflow"
            - "x"
        settings:
          enabled: true
          prefix: "!"
        file_search:
          enabled: true
          prefix: "/"
          backend: "index"
          show_path: true
        emoji:
          enabled: true
          prefix: ";"
        color:
          enabled: true
          prefix: ":"
        snippets:
          enabled: false
      popup:
        width: 540
        height: 278
        blur: false
        round_corners: false
      callbacks:
        on_left: "toggle_quick_launch"
      keybindings:
        - keys: "alt+c"
          action: "toggle_quick_launch"
          screen: "cursor"



  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
