watch_stylesheet: true
watch_config: true
debug: false
update_check: true

bars:
  status-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "bottom"
      align: "center"
    animation:
      enabled: true
      duration: 10
    blur_effect:
      enabled: false
      round_corners: false
      dark_mode: true
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 32
    layouts:
      center:
        alignment: "center"
        stretch: false
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left: ["start_menu", "glazewm_workspaces", "hardware-grouper", "glazewm_tiling_direction", "taskbar"]
      center: ["apps"]
      right:  ["cava", "volume", "media", "notifications", "clock", "systray", "quick_launch", "wallpapers", "power_menu"]
widgets:

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {level}"
      icons:
        "muted": "\ueee8" # Icon for muted
        "12": "\uf026"  # Icon for 0-10% volume
        "24": "\uf027"  # Icon for 11-30% volume
        "48": "\uf027"  # Icon for 31-60% volume
        "100": "\uf028" # Icon for 61-100% volume
      audio_menu:
        show_apps: true
        show_apps_expanded: false
        blur: false
        round_corners: false
        round_corners_type: "normal"
        border_color: "system"
        alignment: "center"
        direction: "up"
      callbacks:
        on_left: "toggle_volume_menu"
        on_right: "toggle_mute"
        on_middle: "toggle_label"




  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 0
      show_only_visible: false
      strict_filtering: true
      tooltip: false
      monitor_exclusive: false
      hide_empty: false
      animation:
        enabled: true
        duration: 200
      title_label:
        enabled: true
        show: "always"
        min_length: 6
        max_length: 12
      callbacks:
        on_left: "toggle_window"
        on_middle: "do_nothing"
        on_right: "context_menu"
      preview:
        enabled: true
        width: 240
        delay: 400
        padding: 8
        margin: 8
      ignore_apps:
        processes:
          - "WindowsTerminal.exe"
          - "wt.exe"

  lines:
    type: "yasb.custom.CustomWidget"
    options:
      label: "\uf303"
      label_alt: "\uf303"
      class_name: "separator-widget"
      callbacks:
        on_left: "do_nothing"


  start_menu:
    type: "yasb.home.HomeWidget"
    options:
      blur: false
      round_corners: false
      label: "\ue62a"
      menu_list:
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf015; </span>Startseite", path: "~"}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf107f; </span>Config", command: "explorer", args: [
            "%USERPROFILE%\\.config"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf108; </span>Desktop", command: "explorer", args: [
            "%USERPROFILE%\\Desktop"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf019; </span>Downloads", command: "explorer", 
            args: ["%USERPROFILE%\\Downloads"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf07c; </span>Dokumente", command: "explorer", 
            args: ["%USERPROFILE%\\Documents"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf03e; </span>Bilder", command: "explorer", args: [
            "%USERPROFILE%\\Pictures"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf03d; </span>Videos", command: "explorer", args: [
            "%USERPROFILE%\\Videos"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf001; </span>Musik", command: "explorer", args: [
            "%USERPROFILE%\\Music"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf023; </span>AppData", command: "explorer", args: [
            "%APPDATA%"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf1f8; </span>Papierkorb", command: "explorer", 
            args: ["shell:RecycleBinFolder"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf013; </span>Einstellungen", command: "start", 
            args: ["ms-settings:"], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf0ad; </span>Systemsteuerung", command: "control",
          args: [""], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf437; </span>Task Manager", command: "taskmgr", 
            args: [""], shell: true}
        - {title: "<span style='font-family: \"JetBrainsMono NFP\";'>&#xf05a; </span>Info", command: "winver", args: [""],
          shell: true}
      system_menu: false
      power_menu: false
      alignment: "left"
      direction: "up"
      callbacks:
        on_right: "exec start_menu"

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span style='font-size: 20px !important;'>{wifi_icon}</span>{wifi_strength}%"
      label_alt: "<span style='font-size: 20px !important;'>{wifi_icon}</span> Sol"
      update_interval: 5000
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec cmd.exe /c start ms-settings:network"
        on_right: "toggle_label"
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span>{ip_addr}"
      ethernet_icon: "\uEBA9"
      get_exact_wifi_strength: true
      wifi_icons: ["\uE872", "\uE873", "\uE874", "\uE701"]
      menu_config:
        blur: false
        round_corners: false
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "up"
        offset_top: 6
        offset_left: 0
        wifi_icons_secured: ["\uE670", "\uE671", "\uE672", "\uE673"]
        wifi_icons_unsecured: ["\uEC3C", "\uEC3D", "\uEC3E", "\uEC3F"]

  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      label_collapsed: "\uf077"
      label_expanded: "\uf078"
      label_position: "right"
      icon_size: 16
      pin_click_modifier: "alt"
      show_unpinned: true
      show_unpinned_button: true
      show_battery: false
      show_volume: false
      show_network: false
      use_hook: false
      hide_icons: []
      tooltip: true
      show_in_popup: true
      icons_per_row: 4
      popup:
        blur: false
        round_corners: false
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "up"
        offset_top: 6
        offset_left: 0

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%H:%M:%S}"
      label_alt: "{%a. %H:%M %d.%m}"
      tooltip: false
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: "center"
        direction: "down"
        show_week_numbers: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "do_nothing"

  apps:
    type: "yasb.applications.ApplicationsWidget"
    options:
      label: "{data}"
      app_list:
        - {icon: "\uf489", launch: "wt", name: "Terminal"}
        - {icon: "<span style='font-size: 19px;'>\U000f0169</span>", launch: "cmd.exe /c %USERPROFILE%/sublime/SUBLIM~1/sublime_text.exe", name: "Sublime Text"}
        - {icon: "<span style='font-size: 19px;'>\U000f0239</span>", launch: "cmd.exe /c start firefox", name: "Firefox"}
        - {icon: "<span style='font-size: 19px;'>\U000f0a1e</span>", launch: "cmd.exe /c start vscodium://", name: "VSCodium"}
        - {icon: "\uf1ff", launch: "cmd.exe /c start discord:", name: "Discord"}
        - {icon: "<span style='font-size: 19px;'>\uf1bc</span>", launch: "cmd.exe /c start spotify:", name: "Spotify"}
        - {icon: "<span style='font-size: 19px;'>\U000f056e</span>", launch: "cmd.exe /c start glazewm", name: "GlazeWM"}




  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      populated_label: '{name}'
      active_empty_label: '{name}'
      active_populated_label: '{name}'
      empty_label: '{name}'
      focused_populated_label: '{name}'
      focused_empty_label: '{name}'
      offline_label: "^-^"
