        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\uefc5</span> {virtual_mem_used}B"
      label_alt: "<span>\uefc5</span> {virtual_mem_percent}%"
      update_interval: 8000
      hide_decimal: true
      callbacks:
        on_left: "toggle_label"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      label: "<span>\uf2db</span> {info[utilization]}%"
      label_alt: "<span>\uf2db</span> {info[temp]}°C"
